name: 实验提案
description: 提出用于验证产品假设的可逆实验
title: "[Experiment] "
labels:
  - "type: experiment"
body:
  - type: markdown
    attributes:
      value: |
        实验应有明确假设、短周期、可退出性和最小数据范围。开始前请阅读 PRODUCT.md、PRODUCT_STRATEGY.md、ROADMAP.md、ARCHITECTURE.md 及相关 RFC/ADR。

  - type: textarea
    id: hypothesis
    attributes:
      label: 假设与证据
      description: 用“如果……那么……因为……”描述要验证的产品假设，并链接现有证据。
      placeholder: |
        如果：
        那么：
        因为：
        已有证据或未知点：
    validations:
      required: true

  - type: textarea
    id: product_alignment
    attributes:
      label: 产品对齐
      description: 说明目标用户、具体任务/痛点、价值循环阶段和与当前阶段目标的关系。
      placeholder: |
        用户与任务：
        价值循环阶段（Capture/Normalize/Understand/Simulate/Decide/Review/Learn）：
        当前阶段目标：
    validations:
      required: true

  - type: textarea
    id: experiment_design
    attributes:
      label: 实验设计与范围
      description: 明确对象、对照/基线、流程、时长、包含与不包含的范围；保持可逆。
      placeholder: |
        实验对象与样本：
        对照/基线：
        流程与时间窗：
        包含：
        不包含：
    validations:
      required: true

  - type: textarea
    id: data_trust
    attributes:
      label: 数据与信任
      description: 列出最小数据集、来源、时间/口径和状态（actual/user-confirmed/estimated/forecast/insufficient-data），并说明偏差与缺失处理。
      placeholder: |
        数据字段及来源：
        数据状态：
        口径、新鲜度、单位/币种/时区：
        偏差、冲突或缺失处理：
    validations:
      required: true

  - type: textarea
    id: privacy
    attributes:
      label: 隐私与风险
      description: 说明数据最小化、存储/访问/保留、导出/删除、第三方处理和潜在用户伤害。
      placeholder: |
        数据最小化与目的：
        存储、访问与保留：
        导出/删除：
        风险与缓解：
    validations:
      required: true

  - type: textarea
    id: explainability
    attributes:
      label: 可解释性与用户控制
      description: 说明实验结果如何向用户解释、如何标识不确定性，以及用户如何退出或更正。
      placeholder: |
        用户可见解释：
        不确定性标识：
        退出/关闭/更正路径：
    validations:
      required: true

  - type: textarea
    id: input_burden
    attributes:
      label: 输入负担与反焦虑
      description: 说明实验增加的设置/维护成本，以及安静默认、提醒控制和不羞辱的表达。
      placeholder: |
        新增输入成本：
        降低成本的办法：
        反焦虑交互与关闭控制：
    validations:
      required: true

  - type: textarea
    id: success_criteria
    attributes:
      label: 成功标准与决策指标
      description: 定义主要指标、护栏指标、口径、目标和观察窗口，并标明数据状态；新增指标必须说明目的、分子/分母、事件来源、缺失处理、隐私影响和停止条件。
      placeholder: |
        主要指标：
        护栏指标（隐私、错误、焦虑、留存等）：
        指标目的、分子/分母和事件来源：
        缺失处理与指标级隐私影响：
        目标/阈值、观察窗口与停止条件：
        指标状态：
    validations:
      required: true

  - type: textarea
    id: exit_criteria
    attributes:
      label: 退出、暂停或回滚标准
      description: 写明失败、伤害、数据质量不足或到期时的处理；实验到期必须形成结论。
      placeholder: |
        失败/伤害阈值：
        到期日期：
        退出、回滚、继续或转 RFC 的决策：
        决策负责人：
    validations:
      required: true

  - type: textarea
    id: validation_plan
    attributes:
      label: 验证与记录
      description: 说明日志、测试、人工复核、结果记录位置和复现方式；不得记录真实敏感数据。
      placeholder: |
        测试与监测：
        结果文档位置：
        复现/审计方式：
    validations:
      required: true

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: 提交确认
      options:
        - label: 我已确认实验不改变产品宪法；如有冲突，我会先提交 RFC。
          required: true
        - label: 我已设计退出或回滚路径，并会在到期时记录结论。
          required: true
        - label: 我没有在提案中放入真实个人财务数据或未脱敏证据。
          required: true
