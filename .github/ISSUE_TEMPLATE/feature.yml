name: 功能提案
description: 提出与个人价值流闭环对齐的新功能或产品能力
title: "[Feature] "
labels:
  - "type: feature"
body:
  - type: markdown
    attributes:
      value: |
        提交前请阅读 PRODUCT.md、PRODUCT_STRATEGY.md、ROADMAP.md、ARCHITECTURE.md 和相关 PRD/RFC/ADR。没有完成产品门禁的提案不会直接进入实现。

  - type: textarea
    id: product_alignment
    attributes:
      label: 产品对齐
      description: 说明目标用户、具体任务/痛点、价值循环阶段，以及为什么现在验证这件事。
      placeholder: |
        用户与任务：
        价值循环阶段（Capture/Normalize/Understand/Simulate/Decide/Review/Learn）：
        问题证据与预期改变：
    validations:
      required: true

  - type: textarea
    id: user_outcome
    attributes:
      label: 用户结果与使用场景
      description: 描述触发场景、主要流程和用户完成后能做出的更好判断。
      placeholder: |
        触发场景：
        用户步骤：
        可观察的用户结果：
    validations:
      required: true

  - type: textarea
    id: data_trust
    attributes:
      label: 数据与信任
      description: 列出关键输入、来源、时间/口径和数据状态；必须区分 actual、user-confirmed、estimated、forecast、insufficient-data。
      placeholder: |
        关键数据及来源：
        数据状态（actual/user-confirmed/estimated/forecast/insufficient-data）：
        新鲜度、单位、币种、时区或历史口径：
        数据不足或冲突时的降级方式：
    validations:
      required: true

  - type: textarea
    id: privacy
    attributes:
      label: 隐私与数据主权
      description: 说明收集/处理的数据、必要性、存储与访问、保留期限，以及导出、更正和删除方案；不要粘贴真实个人数据。
      placeholder: |
        数据字段与最小化理由：
        存储、访问与保留：
        导出/更正/删除：
        是否涉及第三方或跨设备同步：
    validations:
      required: true

  - type: textarea
    id: explainability
    attributes:
      label: 可解释性与不确定性
      description: 说明用户如何看到输入、公式/推导、来源、时间戳、假设和修正路径。
      placeholder: |
        用户可见的解释：
        假设与不确定性：
        更正或申诉方式：
    validations:
      required: true

  - type: textarea
    id: input_burden
    attributes:
      label: 输入负担与反焦虑
      description: 说明首次设置和持续维护成本，以及如何避免羞辱、排名、催促和过度提醒。
      placeholder: |
        首次设置成本：
        每周/每月维护成本：
        自动化、批量处理或缺失数据方案：
        安静默认值、关闭控制和反焦虑文案：
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 范围
      description: 明确本次包含、不包含和不在本次解决的问题；必要时链接相关 RFC/ADR。
      placeholder: |
        包含：
        不包含：
        依赖或前置决策：
    validations:
      required: true

  - type: textarea
    id: success_criteria
    attributes:
      label: 成功标准
      description: 使用可验证的行为、质量或学习指标，并标明指标是实际、用户确认、估算、预测还是数据不足；新增指标必须说明目的、分子/分母、事件来源、时间窗口、缺失处理、隐私影响和停止条件。
      placeholder: |
        用户行为/结果：
        指标目的、分子/分母与口径：
        事件来源、缺失处理与隐私影响：
        验证方式与时间窗口：
        停止条件：
    validations:
      required: true

  - type: textarea
    id: exit_criteria
    attributes:
      label: 退出、暂停或回滚标准
      description: 写明什么证据会导致暂停、缩小、回滚或放弃该功能，以及谁负责决策。
      placeholder: |
        失败或风险信号：
        触发阈值/截止日期：
        退出、回滚或转 RFC 的动作：
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收与验证计划
      description: 列出测试、手工验收、可访问性、移动端、隐私和失败降级检查。
      placeholder: |
        自动化测试：
        手工验收：
        数据/隐私验证：
    validations:
      required: true

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: 提交确认
      options:
        - label: 我已阅读产品宪法；如果本提案与其冲突，我会先提交 RFC。
          required: true
        - label: 我没有在提案中放入真实收入、资产、订阅、身份数据或未脱敏截图。
          required: true
