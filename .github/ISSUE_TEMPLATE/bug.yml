name: 缺陷报告
description: 报告可复现的产品、数据、隐私或工程缺陷
title: "[Bug] "
labels:
  - "type: bug"
body:
  - type: markdown
    attributes:
      value: |
        请勿在报告中粘贴真实收入、资产、订阅、身份信息、密钥或未脱敏截图。可以使用合成数据，并说明数据状态。疑似安全或隐私事件请先阅读 SECURITY.md 并使用私密报告渠道。

  - type: textarea
    id: impact
    attributes:
      label: 影响与严重性
      description: 说明影响用户、价值循环阶段、受影响功能/版本、发生频率和严重性。
      placeholder: |
        受影响用户/场景：
        价值循环阶段：
        影响范围与频率：
        严重性（阻断/高/中/低）：
    validations:
      required: true

  - type: textarea
    id: data_privacy
    attributes:
      label: 数据与隐私影响
      description: 说明是否涉及错误数字、数据丢失、越权、泄露、第三方同步或错误的状态标注（actual/user-confirmed/estimated/forecast/insufficient-data）。如疑似安全事件请不要公开细节，改走私密安全渠道。
      placeholder: |
        涉及的数据与状态：
        数据是否丢失、错算、错标或泄露：
        隐私/权限影响：
        是否已采取隔离或撤回措施：
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 使用最小、可脱敏的步骤和合成输入，使他人能稳定复现。
      placeholder: |
        1.
        2.
        3.
        合成输入/前置条件：
    validations:
      required: true

  - type: textarea
    id: expected_actual
    attributes:
      label: 预期与实际结果
      description: 分别描述预期行为、实际行为、显示口径和错误提示。
      placeholder: |
        预期：
        实际：
        相关计算/口径/时间范围：
    validations:
      required: true

  - type: textarea
    id: regression
    attributes:
      label: 回归信息
      description: 说明是否为回归、最后已知正常版本/提交、首次发现版本及可能引入的变更；若无法判断请明确写未知。
      placeholder: |
        是否回归（是/否/未知）：
        最后已知正常版本或提交：
        首次异常版本或提交：
        相关变更：
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境与证据
      description: 提供环境、浏览器/设备、日志摘要、截图或录屏链接；证据必须脱敏且不含秘密。
      placeholder: |
        应用版本/提交：
        操作系统、浏览器或设备：
        脱敏日志/截图/录屏：
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: 临时规避与修复建议
      description: 说明当前是否有安全规避方式、是否需要回滚/通知用户，以及建议的修复方向（可留空写“无”）。
      placeholder: |
        临时规避：
        是否需要回滚或通知：
        修复建议：
    validations:
      required: true

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: 提交确认
      options:
        - label: 我已使用合成或脱敏数据，没有公开秘密或个人敏感数据。
          required: true
        - label: 我已确认这不是需要私密处理的安全事件；如是，我会改走私密安全渠道。
          required: true
